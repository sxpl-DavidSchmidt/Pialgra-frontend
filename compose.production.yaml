name: pialgra-production

services:
  edge:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      SERVICE_DOMAIN: ${SERVICE_DOMAIN:?Set SERVICE_DOMAIN in .env.production}
      ACME_EMAIL: ${ACME_EMAIL:?Set ACME_EMAIL in .env.production}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      frontend:
        condition: service_healthy
    networks:
      - app

  frontend:
    build:
      context: .
      args:
        VITE_API_BASE_URL: ""
    restart: unless-stopped
    environment:
      SERVICE_DOMAIN: ${SERVICE_DOMAIN:?Set SERVICE_DOMAIN in .env.production}
      API_UPSTREAM: http://backend:8080
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8081/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - app

  backend:
    extends:
      file: ${BACKEND_PATH:-../Pialgra-backend}/compose.yaml
      service: backend
    ports: !reset []
    restart: unless-stopped
    environment:
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env.production}
      CORS_ALLOWED_ORIGINS: https://${SERVICE_DOMAIN:?Set SERVICE_DOMAIN in .env.production}
      SESSION_COOKIE_SECURE: "true"
      SERVER_FORWARD_HEADERS_STRATEGY: native
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 45s
    networks:
      - app
      - database

  postgres:
    extends:
      file: ${BACKEND_PATH:-../Pialgra-backend}/compose.yaml
      service: postgres
    ports: !reset []
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env.production}
    networks:
      - database

networks:
  app:
  database:
    internal: true

volumes:
  postgres-data:
    name: ${POSTGRES_VOLUME:-pialgra-production-postgres}
  caddy-data:
  caddy-config:
